[package]
name = "epd-frame-rs-2"
version = "0.1.0"
edition = "2024"

[features]
std = []

[workspace]
members = ["epd-frame-rs-2-common", "epd-frame-rs-2-rp235", "epd-frame-rs-2-simulator"]

[workspace.dependencies]
defmt = "1.0.1"
defmt-or-log = { version = "0.2.3" }
defmt-rtt = "1.1.0"
log = { version = "0.4.29", default-features = false }

epd-frame-rs-2-common = { path = "epd-frame-rs-2-common", default-features = false }

zerocopy = { version = "0.8.47", features = ["derive"], default-features = false }
thiserror = { version = "2.0.18", default-features = false }
serde = { version = "1.0.228", features = ["derive", "alloc"], default-features = false }
serde_json = { version = "1.0.149", features = ["alloc"], default-features = false }

reqwless = { version = "0.14.0", default-features = false }

embassy-net = { version = "0.8.0", features = ["dhcpv4", "tcp", "udp", "proto-ipv4", "dns"], default-features = false }
embedded-graphics = { version = "0.8.2", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
embedded-hal-async = { version = "1.0.0", default-features = false }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }
embassy-futures = { version = "0.1.2", default-features = false }

static_cell = { version = "2.1.1", default-features = false, features = [] }
aligned = "0.4.3"
chrono = { version = "0.4.44", features = ["serde", "alloc"], default-features = false }

[dependencies]



