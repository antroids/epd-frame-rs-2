[package]
name = "epd-frame-rs-2-rp235"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["executor-thread", "defmt", "executor-interrupt", "platform-cortex-m"] }
embassy-net = { version = "0.9.0", features = ["dhcpv4", "tcp", "defmt", "udp", "proto-ipv4", "dns"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "rp235xb"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

embedded-alloc = { version = "0.7.0" }

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { version = "1.0", features = ["print-defmt"] }
